<style>
/* Same visual world as the decks: Halkbank blue ground, white cards. */
:root{--blue:#225592;--blue-ink:#1B4677;--ink:#0F172B;--muted:#5A6678;--tint:#DCE8F7;--paper:#FFFFFF;--orange:#F26F21;
  --font:'Inter','Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--blue);color:#FFFFFF;font-family:var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-block:clamp(32px,7vh,80px) 40px;gap:clamp(32px,6vh,64px)}
header p{margin:0;font-size:clamp(16px,1.8vw,22px);letter-spacing:.04em}
header h1{margin:10px 0 0;font-size:clamp(40px,6vw,76px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
header .sub{margin-top:16px;font-size:clamp(15px,1.6vw,20px);color:var(--tint);max-width:60ch;line-height:1.45}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px}
a.card{display:flex;flex-direction:column;gap:12px;min-height:230px;padding:28px 30px;border-radius:22px;background:var(--paper);color:var(--ink);text-decoration:none;
  box-shadow:0 18px 40px rgba(8,24,48,.25);transition:transform .3s ease,box-shadow .3s ease}
a.card:hover{transform:translateY(-4px);box-shadow:0 26px 52px rgba(8,24,48,.32)}
a.card:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.card .no{font:600 13px/1 var(--mono);letter-spacing:.16em;color:var(--blue)}
.card b{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.card span.d{font-size:16px;line-height:1.5;color:var(--muted)}
.card .go{margin-top:auto;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--blue)}
.card .go svg{width:18px;height:18px;transition:transform .3s ease}
a.card:hover .go svg{transform:translateX(4px)}
footer{margin-top:auto}
footer img{width:150px;height:auto;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
